<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Plants vs Zombies</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #000;
            font-family: Arial, sans-serif;
        }
        #ruffle {
            width: 100%;
            height: 100%;
            max-width: 800px;
            max-height: 600px;
        }
    </style>
</head>
<body>
    <div id="ruffle"></div>
    
    <script src="https://cdn.jsdelivr.net/npm/ruffle-rs@latest/ruffle.js"></script>
    <script>
        window.RufflePlayer = window.RufflePlayer || {};
        window.RufflePlayer.config = {
            "allowScriptAccess": false,
            "autoplay": "on"
        };
        
        const ruffle = window.RufflePlayer.newest();
        const player = ruffle.createPlayer("ruffle");
        player.load("plants-vs-zombies.swf");
    </script>
</body>
</html>
