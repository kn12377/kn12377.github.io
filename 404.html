<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>404 – Not found</title>
<style>

body {
  margin: 0;
  padding: 2rem;
  font-family: Verdana, Geneva, sans-serif;
  text-align: center;               
}


.image-wrapper {
  display: flex;                    
  justify-content: center;         
  align-items: center;              
  margin: 2rem 0;                   
}


.image-wrapper img {
  max-width: 100%;
  height: auto;
}


.hammer {
  height: 10rem;
  width: 10rem;
  position: absolute;
  left: 25%;               
  top: 50%;
  transform: translateX(-50%);  
  animation: swing 4s ease-in-out infinite;
}

@keyframes swing {
  0%   { transform: rotate(0deg) translateX(-50%); }
  25%  { transform: rotate(-90deg) translateX(-50%); }
  50%  { transform: rotate(0deg) translateX(-50%); }
  75%  { transform: rotate(-90deg) translateX(-50%); }
  100% { transform: rotate(0deg) translateX(-50%); }
}


.face {
  height: 1rem;
  width: 1rem;
  background: #676767;
  position: absolute;
  left: 2.5rem;
  top: 0.25rem;
  border-radius: 2px;
}
.head {
  height: 2rem;
  width: 1.5rem;
  background: #676767;
  margin: 0 auto;
}
.head::before {
  content: "";
  height: 0;
  width: 0.5rem;
  position: absolute;
  left: 3rem;
  top: 0.25rem;
  border-bottom: 1rem solid #676767;
  border-left: .5rem solid transparent;
  border-right: .5rem solid transparent;
  transform: rotate(270deg);
}
.head::after {
  content: "";
  height: 1rem;
  width: 2rem;
  box-shadow: 6px .5rem 0 7px #676767;
  border-radius: 50%;
  position: absolute;
  right: 3rem;
  transform: rotate(180deg);
  top: 1rem;
}
.handle {
  height: 8rem;
  width: 1.5rem;
  margin: 0 auto;
  border-radius: 0 0 1rem 1rem;
  background: #BA6442;
  background-image:
    linear-gradient(90deg, rgba(255,255,255,.07) 50%, transparent 50%),
    linear-gradient(90deg, rgba(255,255,255,.13) 50%, transparent 50%),
    linear-gradient(90deg, transparent 50%, rgba(255,255,255,.17) 50%),
    linear-gradient(90deg, transparent 50%, rgba(255,255,255,.19) 50%);
  background-size: 13px, 29px, 37px, 53px;
}
</style>
</head>

<body>
<h1>Sorry… This Page Can’t Be Found</h1>
<p>Consider Reporting This in Feedback</p>

<div class="image-wrapper">
  <img src="MH-404.png" alt="Worker" width="425" height="425">
</div>

<div class="hammer">
  <div class="face"></div>
  <div class="head"></div>
  <div class="handle"></div>
</div>
</body>
</html>
